services:
  # --- POSTGRESQL DATABASE ---
  postgresql-prod:
    image: postgres:16-alpine
    container_name: fresh-keep-db-prod
    restart: unless-stopped
    volumes:
      - prod-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DATABASE}
      POSTGRES_USER: ${PROD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD}
    ports:
      - "${PROD_POSTGRES_PORT}:5432"
    networks:
      - fresh-keep-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER} -d ${PROD_POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- JAVA SPRING BOOT APP ---
  fresh-keep-app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fresh-keep-app-prod
    restart: always
    ports:
      - "${PROD_APP_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql-prod:5432/${PROD_POSTGRES_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${PROD_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_POSTGRES_PASSWORD}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    networks:
      - fresh-keep-network-prod
    depends_on:
      postgresql-prod:
        condition: service_healthy

volumes:
  prod-data:

networks:
  fresh-keep-network-prod:
    driver: bridge