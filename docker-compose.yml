services:
  # --- POSTGRESQL DATABASE ---
  postgresql-prod:
    image: postgres:16-alpine
    container_name: fresh-keep-postgresql-prod
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - fresh-keep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- JAVA SPRING BOOT APP ---
  fresh-keep-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fresh-keep-app
    restart: always
    ports:
      - "${APP_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql-prod:5432/${POSTGRES_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY}
    networks:
      - fresh-keep-network
    depends_on:
      postgresql-prod:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  fresh-keep-network:
    driver: bridge